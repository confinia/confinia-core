name: promote-production
# Promotion to production (issue #109). Deliberately MANUAL and gated by the
# `production` environment, which carries a required reviewer: a merge to main
# never promotes by itself. The passive colour, already validated on staging,
# becomes active; the previous one stays intact as a one-command rollback.
permissions:
  contents: read

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type "promote" to confirm you validated staging'
        required: true
        default: ''

concurrency:
  group: deploy-production
  cancel-in-progress: false

env:
  DEPLOY_DIR: /home/debian/projects/confinia

jobs:
  promote:
    runs-on: [self-hosted, confinia-vm]
    timeout-minutes: 30
    environment: production
    steps:
      - name: Refuse an unconfirmed run
        env:
          CONFIRM: ${{ inputs.confirm }}     # via env, never interpolated into the script
        run: |
          set -eu
          [ "$CONFIRM" = "promote" ] || {
            echo "::error::validate staging first, then type 'promote'"; exit 1; }

      - name: Promote the passive colour
        run: |
          set -eu
          cd "$DEPLOY_DIR"
          ./deploy/deploy-api.sh promote

      - name: Prove the PROMOTED colour is the one answering
        run: |
          set -eu
          cd "$DEPLOY_DIR"
          # The public smoke alone cannot see this. api_upstreams lists the
          # active colour first and the other as fallback, so if the colour we
          # just promoted is dead, caddy quietly serves the previous one and
          # every public check passes -- against the OLD build. That happened on
          # 2026-08-03: the promotion reported success while production served
          # the previous version for ten minutes (issue #123).
          active=$(cat ~/confinia-edge-state/ACTIVE_COLOR)
          if [ "$active" = blue ]; then port=8091; else port=8092; fi
          echo "active colour is $active, checking 127.0.0.1:$port directly"
          for i in $(seq 1 20); do
            curl -sf --max-time 3 "http://127.0.0.1:$port/healthz" >/dev/null && ok=1 && break
            sleep 3
          done
          if [ "${ok:-0}" != 1 ]; then
            echo "::error::the promoted colour ($active) does not answer on $port; rolling back"
            ./deploy/deploy-api.sh rollback
            exit 1
          fi

      - name: Smoke production, and roll back if it fails
        run: |
          set -eu
          cd "$DEPLOY_DIR"
          mkdir -p "$HOME/.cache/pip"
          if ! podman run --rm --network host \
                 -v "$PWD/tests:/tests:ro" -v "$HOME/.cache/pip:/root/.cache/pip" -w / \
                 -e TEST_API_BASE=https://api.confinia.io \
                 docker.io/library/python:3.12-slim \
                 sh -c "pip install -q pytest requests && pytest -q -p no:cacheprovider tests/smoke_prod.py"; then
            echo "::error::smoke failed on production, rolling back"
            ./deploy/deploy-api.sh rollback
            exit 1
          fi

      - name: Report
        run: |
          {
            echo "### Live on production"
            echo "- https://www.confinia.io"
            echo "- https://api.confinia.io/healthz"
          } >> "$GITHUB_STEP_SUMMARY"
