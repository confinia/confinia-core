name: deploy-staging
# Staging deployment (issue #109). Runs on the VM's self-hosted runner, so no
# credential ever lives in GitHub: the runner pulls jobs, nothing comes in.
#
# Deploys main to the PASSIVE colour and runs the smoke suite against it.
# Production keeps serving the active colour and is untouched (RULES 13).
permissions:
  contents: read

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-staging
  cancel-in-progress: false      # never interrupt a deployment mid-flight

env:
  DEPLOY_DIR: /home/confinia/projects/confinia

jobs:
  stage:
    runs-on: [self-hosted, confinia-vm]
    timeout-minutes: 30
    environment: staging
    steps:
      - name: The runner must not be able to become root
        run: |
          set -eu
          # The whole point of issue #114. Until 2026-08-12 this runner executed
          # as `debian`, which has (ALL) NOPASSWD: ALL on a VM shared with five
          # other products -- so any workflow step was unconstrained root over
          # every tenant. If this ever passes again, the isolation is gone.
          if sudo -n true 2>/dev/null; then
            echo "::error::the runner can sudo without a password; see issue #114"
            exit 1
          fi
          echo "runner is unprivileged, as $(id -un)"

      - name: Sync the deployment mirror to this commit
        run: |
          set -eu
          cd "$DEPLOY_DIR"
          git fetch --quiet origin "$GITHUB_SHA"
          # Untracked files survive: secrets.env, sandbox.env and data/ are
          # gitignored and must never be touched by a deployment.
          git reset --hard --quiet "$GITHUB_SHA"
          echo "mirror at $(git log --oneline -1)"

      - name: Point the staging checkout at this commit
        run: |
          set -eu
          cd "$DEPLOY_DIR"
          # Staging serves its STATIC files from its own checkout (issue #111).
          # Without this the API would be staged while the pages stayed on
          # whatever the checkout last held -- and a static change would still
          # be validated only after it was already live on www.
          ./deploy/checkout-env.sh staging "$GITHUB_SHA"

      - name: Install the shared front-end libraries
        run: |
          set -eu
          cd "$DEPLOY_DIR"
          # MUST run before the edge reload: the edge serves /lib/* from this
          # directory, and an empty one means a 404 on a module -- a silently
          # hanging map, not a visible error (issue #185).
          ./deploy/shared-lib-up.sh

      - name: Reload the edge if its config changed
        run: |
          set -eu
          cd "$DEPLOY_DIR"
          # Until 2026-08-16 nothing in this pipeline touched the running caddy.
          # A Caddyfile change reached the mirror and stopped there, so the edge
          # kept proxying to ports that had been removed -- /grafana served 502
          # in production until someone ran this script by hand. deploy-edge.sh
          # validates in an ephemeral container first and reloads gracefully, so
          # running it every time costs nothing when nothing changed.
          ./deploy/deploy-edge.sh

      - name: Build and stage the passive colour
        run: |
          set -eu
          cd "$DEPLOY_DIR"
          ./deploy/deploy-api.sh stage

      - name: Smoke the staged colour
        run: |
          set -eu
          cd "$DEPLOY_DIR"
          # Hit the passive container directly on the VM rather than through
          # staging.api.confinia.io: that vhost is behind basic auth and only
          # the bcrypt HASH lives on the VM, never the password. Going local
          # also proves the staged build itself answers, not a cached edge.
          active=$(cat ~/confinia-edge-state/ACTIVE_COLOR 2>/dev/null || echo green)
          if [ "$active" = blue ]; then passive=green; port=11220; else passive=blue; port=11120; fi
          echo "smoking the $passive colour on 127.0.0.1:$port"
          # DEV.md rule: everything runs in a container, never host python. The
          # first version built a venv on the host and failed — python3-venv is
          # not installed, and installing it would need sudo, which is exactly
          # the privilege issue #114 is about.
          mkdir -p "$HOME/.cache/pip"
          podman run --rm --network host \
            -v "$PWD/tests:/tests:ro" -v "$HOME/.cache/pip:/root/.cache/pip" -w / \
            -e TEST_API_BASE="http://127.0.0.1:$port" \
            docker.io/library/python:3.12-slim \
            sh -c "pip install -q pytest requests && pytest -q -p no:cacheprovider tests/smoke_prod.py"

      - name: Redeploy the staging stack and reload the sandbox edge
        run: |
          set -eu
          cd "$DEPLOY_DIR"
          # staging.confinia.io/api reaches the DEDICATED STAGING STACK first,
          # not the passive colour -- and nothing here ever redeployed it. The
          # founder opened a staging URL on three separate occasions and got a
          # build up to 17 hours old each time, while the static page beside it
          # was current. It reads exactly like "the fix does not work".
          #
          # After the smoke on purpose: a build that failed must not reach the
          # environment the founder validates on.
          ./deploy/staging-up.sh
          # The sandbox API too: it runs the same image, and leaving it out is
          # how /v1/pricing 404'd on the sandbox while the page beside it was
          # current -- the third instance of "the pipeline updated the mirror
          # but not the process that serves it".
          ./deploy/sandbox-up.sh
          # Cheap and idempotent; the sandbox edge is its own process and its
          # config reached the mirror without ever reaching the running caddy.
          ./deploy/sandbox-edge-up.sh

      - name: Say where to try it
        run: |
          {
            echo "### Staging is up"
            echo
            echo "- https://staging.confinia.io"
            echo "- https://staging.api.confinia.io"
            echo
            echo "Basic auth: user \`confinia\`, password held by the founder."
            echo "Validate, then run **promote-production** to go live."
          } >> "$GITHUB_STEP_SUMMARY"
