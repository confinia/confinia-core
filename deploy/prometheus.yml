global:
  scrape_interval: 15s

scrape_configs:
  - job_name: otel
    static_configs:
      # The collector runs on the HOST network (issue #85: loopback probes);
      # prometheus (bridge) reaches its exporter via the host gateway.
      - targets: ["host.containers.internal:8094"]
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
