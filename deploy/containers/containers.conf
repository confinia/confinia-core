# Confinia only. Since the migration to this user (issue #99) nothing here
# affects any other product on the VM — which is exactly why this change was
# impossible before, and why #123 was debugged blind for a week.
[engine]
# journald was configured but recorded NOTHING: `podman events` returned zero
# lines across twelve hours during which containers were demonstrably created
# and removed. Rootless journald events need a session bus that is not reliably
# present here, and they fail SILENTLY — so "no events" read as "nothing
# happened", which is the worst possible failure for a diagnostic tool.
# The file backend writes to the runtime dir and has no such dependency.
events_logger = "file"
