<!DOCTYPE html><html lang="en"><head><meta charset="utf-8">
<title>Confinia SANDBOX · your account</title>
<meta name="viewport" content="width=device-width, initial-scale=1"><style>
:root{color-scheme:dark}body{margin:0;background:#10151d;color:#e8eaed;font:16px/1.65 system-ui,sans-serif}
.bar{background:#3a2a10;color:#e6ac63;text-align:center;padding:.4rem;font-size:.85rem;font-weight:600}
main{max-width:44rem;margin:0 auto;padding:2rem 1.5rem}
h1{font-size:1.7rem}h1 span{color:#7ab8ff}
.card{border:1px solid #26314a;border-radius:12px;background:#0b0f16;padding:1.2rem;margin:1rem 0}
.row{display:flex;justify-content:space-between;gap:1rem;margin:.35rem 0}.row b{color:#9fb3d1}
code{background:#10151d;border:1px solid #33405a;border-radius:6px;padding:.15rem .4rem;font-size:.85rem;word-break:break-all}
.btn{display:inline-block;border:1px solid #33405a;border-radius:8px;padding:.55rem 1rem;color:#7ab8ff;text-decoration:none;cursor:pointer;background:none;font:inherit}
.btn.primary{background:#2f6f4f;color:#fff;border-color:#2f6f4f}.tier{display:inline-block;font-size:.75rem;text-transform:uppercase;border-radius:99px;padding:.1rem .6rem;background:#26314a;color:#9fb3d1}
.tier.pro,.tier.enterprise{background:#7ab8ff;color:#10151d}.muted{opacity:.7;font-size:.9rem}a{color:#7ab8ff}
</style></head>
<body>
<div class="bar">SANDBOX — test environment. Use Stripe test card 4242 4242 4242 4242, any future date, any CVC. No real payment.</div>
<main>
<h1><a href="/" style="text-decoration:none"><span>Confinia</span></a> · your account <span style="font-size:.7em;opacity:.6">(sandbox)</span></h1>
<div id="content"><p class="muted">Signing you in…</p></div>
</main>
<script src="/polar-embed.js"></script>
<script type="module">
const ISS="https://www.confinia.io/auth/realms/confinia-sbx";  // Keycloak canonical host (cookies)
const CLIENT="confinia-web";
const REDIRECT="https://sandbox.confinia.io/account.html";
const API="/api";
const PRO_CHECKOUT="https://sandbox-api.polar.sh/v1/checkout-links/polar_cl_ISjNBK2UCRY5yztIRetmxG73mC4ro7y4lrwDm2ZyDCw/redirect";
const ENT_CHECKOUT="https://sandbox-api.polar.sh/v1/checkout-links/polar_cl_KCivSS26jm79RNNltwa5VXWDJt5hCPUIRNIKn35sSKU/redirect";
const el=document.getElementById("content");
const b64url=b=>btoa(String.fromCharCode(...new Uint8Array(b))).replace(/\+/g,"-").replace(/\//g,"_").replace(/=+$/,"");
async function sha256(s){return crypto.subtle.digest("SHA-256",new TextEncoder().encode(s));}
function rand(n){const a=new Uint8Array(n);crypto.getRandomValues(a);return b64url(a.buffer).slice(0,n);}
async function login(){const v=rand(64);sessionStorage.setItem("v",v);const c=b64url(await sha256(v));
 const reg=new URLSearchParams(location.search).get("action")==="register"?"/protocol/openid-connect/registrations":"/protocol/openid-connect/auth";
 const p=new URLSearchParams({client_id:CLIENT,response_type:"code",scope:"openid profile email",redirect_uri:REDIRECT,code_challenge:c,code_challenge_method:"S256"});
 location.href=ISS+reg+"?"+p;}
async function exchange(code){const v=sessionStorage.getItem("v");
 const r=await fetch(ISS+"/protocol/openid-connect/token",{method:"POST",headers:{"content-type":"application/x-www-form-urlencoded"},
  body:new URLSearchParams({grant_type:"authorization_code",client_id:CLIENT,code,redirect_uri:REDIRECT,code_verifier:v})});
 if(!r.ok)throw new Error("token");return r.json();}
function claims(j){return JSON.parse(atob(j.split(".")[1].replace(/-/g,"+").replace(/_/g,"/")));}
async function render(tok){const c=claims(tok.id_token);const email=c.email,org=c.organization||"—";
 let key=null,tier="free";
 try{const k=await fetch(API+"/v1/keys",{method:"POST",headers:{"content-type":"application/json"},body:JSON.stringify({email,note:"sandbox account"})}).then(x=>x.json());key=k.key;tier=k.tier;try{localStorage.setItem("confinia_session",JSON.stringify({email,tier,host:location.origin}));}catch(e){}}catch{}
 el.innerHTML=`<div class="card"><div class="row"><b>Email</b><span>${email}</span></div>
   <div class="row"><b>Organization</b><span>${org}</span></div>
   <div class="row"><b>Plan</b><span class="tier ${tier}">${tier}</span></div></div>
   <div class="card"><b>API key</b><p class="muted">Header <code>X-API-Key</code></p>${key?`<code>${key}</code>`:"<p class=muted>key unavailable</p>"}</div>
   ${tier==="free"?`<div class="card"><b>Upgrade (test card)</b><p class="muted">Billing email prefilled with <b>${email}</b> so your key flips to pro automatically after the test payment.</p>
     <p><a class="btn primary" data-polar-checkout data-polar-checkout-theme="dark" href="${PRO_CHECKOUT}?customer_email=${encodeURIComponent(email)}">Subscribe · Pro €49/mo</a>
     <a class="btn" data-polar-checkout data-polar-checkout-theme="dark" href="${ENT_CHECKOUT}?customer_email=${encodeURIComponent(email)}">Enterprise €249/mo</a></p></div>`:
    `<div class="card"><b>Thank you</b><p class="muted">Your <b>${tier}</b> plan is active. (Reload after paying if it still shows free — the webhook takes a second.)</p></div>`}
   <p><a class="btn" href="/">← Home</a> <a class="btn" href="/pricing">Pricing</a> <a class="btn" href="/account.html">Reload</a> <button class="btn" id="lo">Sign out</button></p>`;
 if(window.Polar&&window.Polar.EmbedCheckout)window.Polar.EmbedCheckout.init();
 document.getElementById("lo").onclick=()=>{sessionStorage.clear(); try { localStorage.removeItem("confinia_session"); } catch(e){}location.href=ISS+"/protocol/openid-connect/logout?post_logout_redirect_uri="+encodeURIComponent(REDIRECT)+"&client_id="+CLIENT;};}
(async()=>{const q=new URLSearchParams(location.search);
 if(q.get("code")){try{const t=await exchange(q.get("code"));history.replaceState({},"",REDIRECT);await render(t);}catch(e){el.innerHTML='<p>Sign-in failed. <button class="btn" id="r">Retry</button></p>';document.getElementById("r").onclick=login;}}
 else{el.innerHTML='<div class="card"><b>Sign in or create an account to get your API key and try the Pro upgrade.</b><p style="margin-top:1rem"><button class="btn primary" id="g">Sign in / Create account</button></p></div>';document.getElementById("g").onclick=login;}})();
</script></body></html>
